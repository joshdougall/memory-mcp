name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.0.3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          VALKEY_URL: redis://127.0.0.1:6379

  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/joshdougall/memory-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    # Gated on the image: a release entry pointing at a version with no
    # published image would be worse than no entry at all.
    needs: [build]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release from the tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi

          # actions/checkout leaves refs/tags/<tag> pointing straight at the
          # commit, so the annotated tag object is absent even with
          # fetch-depth: 0. That matters because %(contents:body) on a
          # lightweight tag silently returns the *commit* message body instead
          # of the annotation, which is wrong but non-empty, so a naive
          # "use the annotation if there is one" check never notices.
          # Fetch the real object and decide from its type, not from emptiness.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

          object_type=$(git cat-file -t "$TAG")
          echo "refs/tags/$TAG is a $object_type object"

          if [ "$object_type" = "tag" ]; then
            git tag -l --format='%(contents:body)' "$TAG" > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then
              echo "Using the annotated tag message as release notes."
              gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag
              exit 0
            fi
            echo "Annotated tag has an empty body."
          fi

          echo "No usable annotation; generating notes from commit history."
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
